      - label: Double tracking entries creating for built-in sources
        commit: 8eea24848e679016c704a36fc5c7e1550599a695
      - label: AniList tracker showing relogin alert unnecessarily
        commit: e5f41e907d9dc7f7de2aa7b177a33c5b0dd06537
