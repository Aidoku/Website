        commit: 17e511f7e9d91e2d98da8a8e8ccde3a12799e612
      - label: Improved performance for reading large downloads
        commit: c60871c737ba92fde88d01aecdd17df04c0a0432

  - version: "0.8.4"
    date: 2026-07-03T05:27:41Z
