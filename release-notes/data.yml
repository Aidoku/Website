versions:
  - version: "0.9"
    date: 2026-09-03T20:17:08Z
    main_changes:
      - label: OCR dictionary support (iOS 18+)
        description: Import Yomitan-compatible dictionaries in the app and look up words while reading.
        commit: 31dbf32ca9be6bbb80b5ab33b277003098742a76
        contributor: GameFuzzy
      - label: Suwayomi built-in source
        description: Read and track from a Suwayomi instance, just like Komga and Kavita.
        commit: 97e5073722b1a7c0ff69a7e17ded9d3f53cc02ac
      - label: Auto scroll for webtoon reader
        description: Enable and press the play button to scroll without touching your device
        commit: eb812a56593631c03997de6b5d343b2dbd3bea62
      - label: Fixed CloudFlare handling
        description: CloudFlare issues that caused external sources to break should be resolved.
        commit: 56455db7a215d359092c99617b1e126ceed7e5d2
      - label: Disable sources option
        description: Temporarily disable sources without uninstalling them, e.g. if they are broken but could be fixed by an update.
        commit: 0ec3eab03e0b0587a966385ab0ea8e96e7f8f515
      - label: Improved library loading speed
        commit: e21de3b3e0ae31e0cb03063101730936653c57be
        contributor: Amqx
      - label: Improved webtoon reader performance
        description: Crashes due to memory usage, particularly when reading downloaded chapters, should be much less frequent.
        commit: 3f434d35930b836073cca87552dbbbd97a83686f
    other_features:
      - label: Name field when creating backup
        commit: 579be4596fbc1f619e6e8b1fa889ef75f5527694
      - label: Improved iOS 27 support
        description: Later iOS 27 betas changed things and required some style updates.
        commit: b706e9a7e073dfa2527a272a23f13cc2e7615fb1
      - label: Double tap history tab to continue reader
        commit: 95f78ed4769e11420be8c0cb3e858fd85b431786
        contributor: Amqx
      - label: Prompt resuming interrupted library refreshes
        commit: 9619b56c2296e13a60014378e77fcb689a7e6664
      - label: Properly display failed downloads
        commit: c4bb4bcb724d0c790e00fb9df1a208043bad3c29
      - label: Sortable editable list settings
        description: Sources that have editable list settings can now take into account the order of items.
        commit: 2e697f3fffef9f32b5131c5351dae7876f43346a
      - label: Improved animations
        description: Various transition animations (e.g. home, history, and source loading) have been updated to be more smooth.
      - label: Migrate and keep history option
        commit: f8c4cb9d8a0981e3182a8efeb5dbbd61ca4ea39d
      - label: Download external sources after restoring backup
        commit: afe715d8ac94d4700d47c07fa7a4f12db110f704
        contributor: machsix
      - label: Prefetch pages into next chapter according to preload setting
        commit: b36b9b25a9d1ef6a74cd7dc09c6fc44f1273c7d1
        contributor: Amqx
      - label: Cover image processing support for sources
        commit: 4acf3c085d542d1962a07f5887c823164cd9fe67
      - label: Text reader themes
        commit: 3a5c94830f445b3b902241a134419192b9b3d234
        contributor: rbertus2000
      - label: Dismiss expanded cover view with a swipe
        commit: 5f15a447cdeac7104672d2d558931c9c0855557b
        contributor: Amqx
      - label: Tap on series title to global search
        commit: 35a0da912ce20bd79bb75145eb49c6269df247a6
        contributor: Amqx
    other_fixes:
      - label: Improved backup information loading speed
        commit: b520f5a97ce6ebafdd65f120af1cad5505559ffb
        contributor: Amqx
      - label: Library refresh not rescheduling and not sending notifications
        commit: 15647b2101a07ccf758ee9ee30b3ed690c50b8eb
